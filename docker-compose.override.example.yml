# 服务器本地配置模板
#
# 用法：
#   cp docker-compose.override.example.yml docker-compose.override.yml
#   或直接运行 scripts/bootstrap-mac-mini.sh 自动生成
#
# 这个文件本身可以入库；生成出来的 docker-compose.override.yml 已被
# .gitignore 排除，且 CI 部署时会被 rsync 排除，不会覆盖你改过的版本。
#
# 注意：`!override` 是 Compose 2.24+ 的 YAML 标签，表示「替换」而不是「追加」列表。
# 不用它的话，端口会变成「仓库里的 + 你写的」两份叠加。
#
# S3_PUBLIC_ENDPOINT 不在这里写死：它来自 .env，由 docker-compose.yml 里的
# ${S3_PUBLIC_ENDPOINT:-http://localhost:7313} 读取。换域名只改 .env 即可。

services:
  app:
    build:
      context: .
      # 国内网络构建建议用 Dockerfile.local（apt / PyPI / npm 换国内源）。
      # 海外服务器可以删掉这行，改用仓库自带的 Dockerfile。
      dockerfile: Dockerfile.local
    ports: !override
      # 只绑本机，由 Cloudflare Tunnel 或反向代理对外提供
      - "127.0.0.1:7302:7302"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.local

  # 数据库和缓存不对外暴露。
  # 只有本地调试时才临时放开端口，用完记得改回来（否则整个公网都能连）。
  postgres:
    ports: !override []
  redis:
    ports: !override []

  minio:
    ports: !override
      - "127.0.0.1:7313:9000"   # S3 API
      - "127.0.0.1:7314:9001"   # 管理控制台
