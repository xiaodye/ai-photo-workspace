name: deploy

# 合并到 main 后自动部署；workflow_dispatch 用于首次验证或手动重发
on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一时间只允许一个部署，避免连续合并并发打架
concurrency:
  group: deploy-mac-mini
  cancel-in-progress: false

permissions:
  contents: read

env:
  SSH_HOST: ssh.x-pages.cc.cd
  SSH_USER: lansen
  APP_DIR: apps/ai-photo-workspace
  # Mac Mini 的 sshd 主机公钥（Ed25519），固定写死避免中间人攻击
  SSH_HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIADfrdQkQe/FYKVNWMg8zOGuqAIV2e/mBCAN+TCdm7bs

jobs:
  deploy:
    name: 部署到 Mac Mini
    # 只在本人仓库运行，fork 出来的仓库即使改了 workflow 也跑不到你的机器
    if: github.repository_owner == 'xiaodye'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 安装 cloudflared
        run: |
          curl -fsSL -o /tmp/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          sudo install -m 0755 /tmp/cloudflared /usr/local/bin/cloudflared
          cloudflared --version
          rsync --version | head -1

      - name: 准备 SSH 凭证
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # 先校验私钥本身可用，失败信息比 SSH 报错更直观
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          echo "${SSH_HOST} ${SSH_HOST_KEY}" >> ~/.ssh/known_hosts

      - name: 同步代码到 Mac Mini
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          # 走 rsync 而不是让 Mac Mini 自己 git pull：家庭宽带访问 GitHub 不稳定，
          # runner 侧拿到代码后再增量同步，避免把网络抖动变成部署失败。
          # 排除项保护 Mac Mini 上的本地配置不被覆盖或删除。
          rsync -az --delete --stats \
            --exclude '.git/' \
            --exclude '.DS_Store' \
            --exclude '.env' \
            --exclude '.env.local' \
            --exclude 'docker-compose.override.yml' \
            --exclude 'Dockerfile.local' \
            --exclude 'node_modules/' \
            --exclude '.venv/' \
            --exclude '__pycache__/' \
            --exclude 'client/dist/' \
            -e "ssh -o ProxyCommand='cloudflared access ssh --hostname %h' -o IdentitiesOnly=yes -o ConnectTimeout=30 -o ServerAliveInterval=15" \
            ./ "${SSH_USER}@${SSH_HOST}:${APP_DIR}/"

      - name: 构建并重启
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          ssh -o ProxyCommand="cloudflared access ssh --hostname %h" \
              -o IdentitiesOnly=yes \
              -o ConnectTimeout=30 \
              -o ServerAliveInterval=15 \
              "${SSH_USER}@${SSH_HOST}" "DEPLOY_SHA=${{ github.sha }} bash -s" <<'EOS'
          set -euo pipefail
          export PATH="/usr/local/bin:/opt/homebrew/bin:$PATH"
          cd ~/apps/ai-photo-workspace

          echo "==> 部署版本: ${DEPLOY_SHA:0:8}"

          echo "==> 构建并启动容器"
          docker compose --profile deploy up -d --build

          echo "==> 数据库迁移"
          docker compose --profile deploy exec -T app alembic upgrade head

          echo "==> 健康检查"
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS localhost:7302/api/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "!! 健康检查失败，最近日志："
            docker compose --profile deploy logs --tail=60 app || true
            exit 1
          fi

          echo "==> SPA 深层路由验收"
          code=$(curl -s -o /dev/null -w '%{http_code}' localhost:7302/editor/smoke)
          if [ "$code" != "200" ]; then
            echo "!! /editor/smoke 返回 $code，SPA fallback 未生效"
            exit 1
          fi

          echo "==> 部署完成"
          curl -fsS localhost:7302/api/health; echo
          EOS
